{% set version = "3.2" %}

package:
  name: python-wget
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/w/wget/wget-{{ version }}.zip
  sha256: 35e630eca2aa50ce998b9b1a127bb26b30dfee573702782aa982f875e3f16061

build:
  number: 1
  noarch: python
  script: python -m pip install --no-deps --ignore-installed .

requirements:
  build:
    - python {{ python_min }}
    - pip
  run:
    - python >={{ python_min }}

test:
  imports:
    - wget
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: http://bitbucket.org/techtonik/python-wget/
  license: Public Domain
  summary: 'pure python download utility'

extra:
  recipe-maintainers:
    - lsetiawan
    - ocefpaf
